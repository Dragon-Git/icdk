# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python package

on:
  push:
    branches: [ "master" ]
    tags: ["*"]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        os: ["ubuntu-latest"]
        include:
          - python-version: "3.14"
            os: "macos-latest"
          - python-version: "3.14"
            os: "windows-latest"

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: true

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        version: "0.12.5"

    - name: Install Python dependencies
      run: uv pip install --system --break-system-packages -e '.[test]'

    - name: Lint with ruff
      uses: astral-sh/ruff-action@v3

    - name: Test with pytest
      run: pytest --cov src --cov-report=xml --cov-report=term --cov-fail-under=60

    # Verilator is a generator-output smoke test, not a Python test,
    # so it lives in the test job (not as its own job) and only runs
    # on Linux where the UVM source layout is standard. macOS-26 /
    # Windows runners are skipped to keep the matrix runtime
    # reasonable — the Linux lint pass and the Linux sim already
    # cover the cross-platform concerns we care about.
    - name: Set up Verilator
      if: runner.os == 'Linux'
      # veryl-lang/setup-verilator@v2 downloads a prebuilt Verilator
      # binary (the packaged release) and adds it to ``PATH``. We use
      # the default ``latest`` tag which tracks the newest 5.x release.
      uses: veryl-lang/setup-verilator@v2

    - name: Install z3 (for UVM constraint solving)
      if: runner.os == 'Linux'
      # UVM's randomize() constraint solver shells out to an external
      # SMT solver; without it the sim log is spammed with
      # ``VlRProcess::open: execvp(z3): No such file or directory``.
      run: sudo apt-get update && sudo apt-get install -y z3

    - name: Clone UVM source for Verilator
      if: runner.os == 'Linux'
      # uvm_bridge uses this Dragon-Git fork; the upstream
      # verilator/uvm-verilator repo no longer tracks the 1.x sources
      # we need. ``UVM_HOME`` is consumed by ``test/test_verilator_lint.py``.
      run: |
        git clone --depth 1 https://github.com/Dragon-Git/uvm-verilator.git /tmp/uvm-verilator
        echo "UVM_HOME=/tmp/uvm-verilator/src" >> "$GITHUB_ENV"

    - name: Run Verilator lint test
      if: runner.os == 'Linux'
      # Fast static check — ``verilator --lint-only`` over the
      # generator output. Catches ``\`ifdef`` guard mistakes, type
      # mismatches, and missing forward declarations. ``-s`` surfaces
      # the Verilator output so a failure is reproducible from the run log.
      run: pytest -v -s test/test_verilator_lint.py::test_verilator_lint_typical

    - name: Run Verilator full sim test
      if: runner.os == 'Linux'
      # End-to-end build + run: ``verilator --binary`` compiles a C++
      # executable, then we invoke it. The test asserts the
      # executable ran and produced output. ``-s`` shows the Vtb stdout
      # (the UVM banner / report summary) in the run log. Skippable via
      # ``ICDK_SKIP_VERILATOR_SIM=1`` and auto-skipped on toolchains
      # that cannot build a C++20 binary (Alpine / no coroutines).
      run: pytest -v -s test/test_verilator_lint.py::test_verilator_sim_typical

    - name: Upload coverage to Codecov
      if: runner.os == 'Linux' && matrix.python-version == '3.13'
      uses: codecov/codecov-action@v7
      with:
        files: ./coverage.xml
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: false

  xezim-test:
    # XeZIM cross-simulator check, mirroring Dragon-Git/uvm_bridge's
    # xezim-test job: run the *same* generated testbench the Verilator
    # tests use (typical.json, same filelist, same plusargs, same
    # uvm_syoscb patch), so any construct the two simulators disagree
    # on shows up here instead of silently diverging.
    #
    # XeZIM is built from its ``main`` branch rather than taken from a
    # release tarball: every XeZIM defect this job has found was fixed
    # upstream and the fixes reach ``main`` long before a release is cut,
    # so pinning a release would keep the job red on bugs that no longer
    # exist. The trade-off is a ~15 minute Rust build, which is why this
    # job is Linux-only -- the macOS runner would pay that cost again for
    # the same SV-level signal, and the macOS-specific part of the test
    # (the ``cc`` wrapper's ``-Wl,-U`` branch) is covered by the wrapper's
    # own logic being platform-independent.
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: true

    - name: Set up Python 3.12
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"

    - name: Install Python dependencies
      run: python -m pip install -e '.[test]'

    - name: Clone XeZIM main
      id: xezim
      run: |
        git clone --depth 1 https://github.com/aionhw/xezim.git "$RUNNER_TEMP/xezim-src"
        echo "sha=$(git -C "$RUNNER_TEMP/xezim-src" rev-parse HEAD)" >> "$GITHUB_OUTPUT"
        git -C "$RUNNER_TEMP/xezim-src" log --oneline -1

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache the Rust build
      # Keyed on the XeZIM commit: a new ``main`` invalidates the cache, and
      # ``restore-keys`` still lets the unchanged dependency crates be reused.
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: ${{ runner.temp }}/xezim-src
        key: ${{ steps.xezim.outputs.sha }}

    - name: Build XeZIM
      # ``cargo build`` also fetches the Accellera UVM sources it tests
      # against, into ``target/uvm-checkout/1800.2-2020`` -- that tree is
      # what the next step installs as the prefix's ``share/uvm``.
      run: cargo build --release --manifest-path "$RUNNER_TEMP/xezim-src/Cargo.toml"

    - name: Assemble an install prefix
      # ``test/test_xezim.py`` locates its inputs relative to the binary:
      # ``<prefix>/share/uvm/src/uvm_pkg.sv`` and
      # ``<prefix>/include/uvm_dpi_xezim.cc``. A source build produces
      # neither in that layout, so build the prefix here.
      run: |
        src="$RUNNER_TEMP/xezim-src"
        prefix="$RUNNER_TEMP/xezim"
        uvm="$src/target/uvm-checkout/1800.2-2020"
        test -f "$uvm/src/uvm_pkg.sv" || { echo "UVM sources not found at $uvm"; exit 1; }

        mkdir -p "$prefix/bin" "$prefix/share/uvm" "$prefix/include"
        cp "$src/target/release/xezim" "$prefix/bin/xezim"
        cp -a "$uvm/src" "$prefix/share/uvm/src"
        cp "$src/include/"*.h "$src/include/uvm_dpi_xezim.cc" "$prefix/include/"

        echo "$prefix/bin" >> "$GITHUB_PATH"
        "$prefix/bin/xezim" -V

    - name: Run xezim test
      # ``-s`` prints XeZIM's full log, so a failure is reproducible from the
      # job output alone.
      run: pytest -v -s test/test_xezim.py

  build:
    needs:
      - test
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: actions/setup-python@v7
        name: Install Python
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.5"

      - name: Build
        run: uv build

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: |
            dist/*.tar.gz
            dist/*.whl

      - name: Release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/*.tar.gz
            dist/*.whl
          generate_release_notes: true

  deploy:
    needs:
      - build

    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write

    # Only publish when a tag is pushed.
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
